<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calex Lights</title>
<style>
  :root {
    --bg: #f4f4f6; --card: #fff; --text: #1b1b1f; --muted: #6b6b75; --line: #e3e3e8;
    --accent: #f5a524; --off: #c9c9d1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --card: #1c1c21; --text: #ececf1; --muted: #9a9aa6; --line: #2c2c33; --off: #44444d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 16px 8px; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0; }
  .all { display: flex; gap: 8px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding: 12px 16px 32px; max-width: 960px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .card.offline { opacity: .55; }
  .top { display: flex; align-items: center; gap: 12px; }
  .bulb { width: 38px; height: 38px; border-radius: 50%; background: var(--off); flex: none; transition: background .2s, box-shadow .2s; }
  .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 12px; color: var(--muted); }
  .switch { position: relative; width: 50px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--off); border-radius: 28px; transition: .2s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(22px); }
  label.row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input.temp { accent-color: #f0c27b; }
  input[type=color] { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }
  .hidden { display: none !important; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }
</style>
</head>
<body>
<header>
  <h1>Calex Lights</h1>
  <div class="all">
    <button id="allOn">All on</button>
    <button id="allOff">All off</button>
  </div>
</header>
<main id="grid"><div class="empty">Loading…</div></main>

<template id="tpl">
  <div class="card">
    <div class="top">
      <div class="bulb"></div>
      <div style="flex:1;min-width:0">
        <div class="name"></div>
        <div class="status"></div>
      </div>
      <label class="switch"><input type="checkbox" class="power"><span></span></label>
    </div>
    <label class="row cap-brightness hidden">Brightness <input type="range" class="brightness" min="1" max="100"></label>
    <label class="row cap-colourtemp hidden">Warmth <input type="range" class="temp colourtemp" min="1" max="100"></label>
    <label class="row cap-colour hidden">Colour <input type="color" class="colour"></label>
  </div>
</template>

<script>
const grid = document.getElementById('grid');
const tpl = document.getElementById('tpl');
const cards = new Map();

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  return res.json();
}

function render(card, s) {
  const el = card.el;
  card.busy = false;
  el.classList.toggle('offline', !s.online);
  el.querySelector('.status').textContent = s.online ? (s.on ? 'On' : 'Off') : 'Offline – ' + (s.error || '');
  if (!s.online) return;
  el.querySelector('.power').checked = s.on;
  for (const cap of ['brightness', 'colourtemp', 'colour']) {
    el.querySelector('.cap-' + cap).classList.toggle('hidden', !(s.caps && s.caps[cap]));
  }
  if (s.brightness != null) el.querySelector('.brightness').value = s.brightness;
  if (s.colourtemp != null) el.querySelector('.colourtemp').value = s.colourtemp;
  if (s.colour) el.querySelector('.colour').value = s.colour;
  const glow = !s.on ? '' : s.mode === 'colour' && s.colour ? s.colour : `hsl(40, 100%, ${92 - (s.colourtemp ?? 50) * 0.15}%)`;
  const bulb = el.querySelector('.bulb');
  bulb.style.background = glow || '';
  bulb.style.boxShadow = glow ? `0 0 18px ${glow}` : '';
}

async function send(card, body) {
  card.busy = true;
  try { render(card, await api('/api/devices/' + card.id, body)); }
  catch (e) { card.busy = false; }
}

async function refresh(card) {
  if (card.busy) return;
  try { render(card, await api('/api/devices/' + card.id)); } catch (e) {}
}

async function init() {
  const devices = await api('/api/devices');
  grid.innerHTML = devices.length ? '' : '<div class="empty">No devices in devices.json</div>';
  for (const d of devices) {
    const el = tpl.content.firstElementChild.cloneNode(true);
    el.querySelector('.name').textContent = d.name;
    el.querySelector('.status').textContent = 'Connecting…';
    const card = { id: d.id, el, busy: false };
    el.querySelector('.power').addEventListener('change', e => send(card, { on: e.target.checked }));
    el.querySelector('.brightness').addEventListener('change', e => send(card, { brightness: +e.target.value }));
    el.querySelector('.colourtemp').addEventListener('change', e => send(card, { colourtemp: +e.target.value }));
    el.querySelector('.colour').addEventListener('change', e => send(card, { colour: e.target.value }));
    grid.appendChild(el);
    cards.set(d.id, card);
    refresh(card);
  }
  setInterval(() => cards.forEach(refresh), 10000);
}

document.getElementById('allOn').onclick = () => cards.forEach(c => send(c, { on: true }));
document.getElementById('allOff').onclick = () => cards.forEach(c => send(c, { on: false }));
init();
</script>
</body>
</html>
