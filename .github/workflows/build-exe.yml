name: Build Windows exe

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Make icon
        run: python -c "import tray; tray.make_icon(256).save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(256,256)])"

      - name: Build CalexLights.exe
        run: >
          pyinstaller --onefile --windowed --name CalexLights --icon icon.ico
          --add-data "index.html;."
          --hidden-import tray
          --collect-submodules tinytuya
          --collect-submodules pystray
          server.py

      - name: Smoke test (web server only)
        shell: pwsh
        run: |
          '[]' | Set-Content dist/devices.json
          $p = Start-Process dist/CalexLights.exe -ArgumentList '--no-tray','--no-browser' -PassThru
          Start-Sleep 20
          $html = (Invoke-WebRequest http://localhost:8765/ -UseBasicParsing).Content
          Stop-Process $p.Id
          if ($html -notmatch 'Calex Lights') { throw 'UI did not load' }

      - name: Smoke test (tray mode)
        shell: pwsh
        run: |
          $p = Start-Process dist/CalexLights.exe -PassThru
          Start-Sleep 20
          $api = (Invoke-WebRequest http://localhost:8765/api/devices -UseBasicParsing).Content
          $alive = -not $p.HasExited
          Stop-Process $p.Id -ErrorAction SilentlyContinue
          Start-Sleep 2
          $log = Get-Content dist/calex-lights.log -Raw -ErrorAction SilentlyContinue
          Write-Output $log
          Remove-Item dist/devices.json, dist/calex-lights.log -ErrorAction SilentlyContinue
          if (-not $alive) { throw 'Tray app exited early' }
          if ($api -ne '[]') { throw "Unexpected API response: $api" }
          if ($log -match 'Traceback') { throw 'Tray app logged an error' }

      - uses: actions/upload-artifact@v4
        with:
          name: CalexLights
          path: dist/CalexLights.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CalexLights.exe
          generate_release_notes: true
