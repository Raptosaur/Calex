name: Build Windows exe

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build CalexLights.exe
        run: >
          pyinstaller --onefile --console --name CalexLights
          --add-data "index.html;."
          --collect-submodules tinytuya
          server.py

      - name: Smoke test
        shell: pwsh
        run: |
          '[]' | Set-Content dist/devices.json
          $p = Start-Process dist/CalexLights.exe -ArgumentList '--no-browser' -PassThru
          Start-Sleep 20
          $html = (Invoke-WebRequest http://localhost:8765/ -UseBasicParsing).Content
          Stop-Process $p.Id
          Remove-Item dist/devices.json
          if ($html -notmatch 'Calex Lights') { throw 'UI did not load' }

      - uses: actions/upload-artifact@v4
        with:
          name: CalexLights
          path: dist/CalexLights.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CalexLights.exe
          generate_release_notes: true
